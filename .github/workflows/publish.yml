
name: Build, Test, Release & Publish

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build & Test
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2

      - run: dart pub get
      - run: dart analyze
      - run: dart format --set-exit-if-changed .

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # Job 2: Create Tag & Release
  create-release:
    needs: build-and-test
    if: needs.build-and-test.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "${{ needs.build-and-test.outputs.tag }}"
          git push origin "${{ needs.build-and-test.outputs.tag }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-and-test.outputs.tag }}
          release_name: Release ${{ needs.build-and-test.outputs.version }}
          body: Release version ${{ needs.build-and-test.outputs.version }}
          draft: false
          prerelease: false

  # Job 3: Publish to pub.dev (Fully Automatic)
  publish-to-pubdev:
    needs: create-release
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2

      - run: dart pub get

      - name: Setup pub.dev credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIAL_JSON }}' > ~/.config/dart/pub-credentials.json

      - name: Publish to pub.dev
        run: dart pub publish --force

      - run: echo "✅ Package successfully published to pub.dev"