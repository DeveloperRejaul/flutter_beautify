name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'index.md'
      - 'CONTRIBUTING.md'
      - 'CONTACT.md'
      - '_config.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Validate HTML
        run: |
          if [ -d "_site" ]; then
            echo "✅ Jekyll build successful"
            find _site -name "*.html" | wc -l | xargs echo "Generated HTML files:"
          else
            echo "❌ Build failed - _site directory not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "📱 GitHub Pages Deployment Summary"
          echo "=================================="
          echo "✅ Site deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "📝 Branch: main"
          echo "🕐 Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "📚 Documentation Pages:"
          echo "  ├─ Landing: /flutter_beautify/"
          echo "  ├─ Installation: /flutter_beautify/docs/installation"
          echo "  ├─ Quick Start: /flutter_beautify/docs/quick-start"
          echo "  ├─ CLI Commands: /flutter_beautify/docs/cli-commands"
          echo "  ├─ Components: /flutter_beautify/docs/components"
          echo "  ├─ Examples: /flutter_beautify/docs/examples"
          echo "  ├─ Contributing: /flutter_beautify/contributing"
          echo "  └─ Contact: /flutter_beautify/contact"
