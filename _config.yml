# Site Information
title: Flutter Beautify - Production UI Widgets CLI
description: A command-line interface tool for scaffolding 26+ pre-built, customizable Flutter UI components with Material Design 3 compliance.
url: https://DeveloperRejaul.github.io
baseurl: /flutter_beautify
repository: DeveloperRejaul/flutter_beautify

# IMPORTANT: Use remote_theme instead of theme for GitHub Pages
# GitHub Pages only supports specific themes - remote_theme is the workaround
remote_theme: just-the-docs/just-the-docs@v0.7.0

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
lsi: false
safe: true

# Logo and favicon
logo: "/assets/logo.png"
favicon_ico: "/assets/favicon.ico"

# Site navigation with left sidebar (like Discord)
nav_order: 1

# Navigation - Enable left sidebar menu
just_the_docs:
  # Enable search
  search_enabled: true
  
  # Collections for organizing docs
  collections:
    guides:
      name: Guides
      nav_order: 1

# Navigation
aux_links:
  "GitHub": https://github.com/DeveloperRejaul/flutter_beautify
  "Pub.dev": https://pub.dev/packages/flutter_beautify
  "Report Issue": https://github.com/DeveloperRejaul/flutter_beautify/issues
  "Discord": https://discord.gg/flutter

# Search configuration
search_enabled: true
search:
  heading_level: 2

# Color scheme (dark for awesome look)
color_scheme: dark
back_to_top: true

# Footer
footer_content: "© 2026 Flutter Beautify | Built with ❤️ by <a href='https://github.com/DeveloperRejaul'>DeveloperRejaul</a> | <a href='https://github.com/DeveloperRejaul/flutter_beautify/blob/main/LICENSE'>MIT License</a>"

# Collections for organizing documents
collections:
  docs:
    output: true
    permalink: /docs/:path/
  guides:
    output: true
    permalink: /guides/:path/

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - .github
  - CHANGELOG.md
  - LICENSE
  - note.txt
  - DEV.md
  - .jekyll-metadata
  - "*.gemspec"